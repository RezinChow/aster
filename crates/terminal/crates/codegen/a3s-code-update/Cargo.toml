[package]
license = "Apache-2.0"
name = "a3s-code-update"
version = "0.1.220-alpha.4"
edition = "2024"
publish = false

[dependencies]
dunce = {workspace = true}
anyhow = {workspace = true}
futures = {workspace = true}
indicatif = {version = "0.18"}
reqwest = {workspace = true}
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
time = {version = "0.3", features = ["serde"]}
tokio = {version = "1", features = ["full", "fs", "process", "io-util", "macros", "time"]}
tracing = {workspace = true}
url = {workspace = true}
flate2 = {workspace = true}
zstd = {workspace = true}
sha2 = {version = "0.10", features = ["force-soft"]}
# MinGit archive extraction. Not `workspace = true`: the workspace pin has
# default features on (aes/bzip2/lzma/zstd); MinGit entries are only deflated.
zip = {version = "3", default-features = false, features = ["deflate-flate2"]}
a3s-tty-utils = {path = "../a3s-tty-utils"}
a3s-code-version = {path = "../a3s-code-version"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-code-shell = {path = "../a3s-code-shell"}
a3s-code-login = {path = "../a3s-code-login"}
a3s-dirs = {path = "../a3s-dirs"}
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}

[target.'cfg(target_os = "macos")'.dependencies]
libc = {workspace = true}

[dev-dependencies]
semver = {workspace = true}
serde_json = {workspace = true}
serial_test = {workspace = true}
tempfile = {workspace = true}
time = {version = "0.3", features = ["serde"]}
tokio = {version = "1", features = ["full", "fs", "macros", "rt-multi-thread", "test-util"]}
wiremock = {workspace = true}
