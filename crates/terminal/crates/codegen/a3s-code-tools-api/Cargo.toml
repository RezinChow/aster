[package]
license = "Apache-2.0"
name = "a3s-code-tools-api"
version = "0.1.220-alpha.4"
description = "Protobuf API definitions for A3S Code tools"
edition = "2024"
publish = false

[dependencies]
tonic-prost = {version = "0.14"}
# Protobuf runtime
prost = {workspace = true}
tonic = {workspace = true}

serde = {workspace = true}
serde_json = {workspace = true}
a3s-tool-protocol = {path = "../../common/a3s-tool-protocol"}

[build-dependencies]
a3s-proto-build = {path = "../../build/a3s-proto-build"}

[package.metadata.cargo-shear]
ignored = ["serde", "tonic"]

[lints]
workspace = true
