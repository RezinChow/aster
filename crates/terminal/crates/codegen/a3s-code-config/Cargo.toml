[package]
license = "Apache-2.0"
name = "a3s-code-config"
version = "0.1.0"
description = "Shared config loading for A3S Code — grok_home, effective config (requirements > user > managed), TOML merge"
edition = "2024"
publish = false

[dependencies]
base64 = {workspace = true}
blake3 = {workspace = true}
dunce = {workspace = true}
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
prod-mc-cli-chat-proxy-types = {path = "../../../prod/mc/cli-chat-proxy-types"}
ring = {version = "0.17"}
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
shellexpand = {workspace = true}
strum = {workspace = true}
thiserror = {workspace = true}
toml = {workspace = true}
tracing = {workspace = true}
urlencoding = {workspace = true}
which = {workspace = true}

# core-foundation: read macOS MDM managed preferences (`ai.x.a3s`) for the
# admin-deployed requirements layer.
a3s-code-version = {path = "../a3s-code-version"}
a3s-tty-utils = {path = "../a3s-tty-utils"}
a3s-code-env = {path = "../a3s-code-env"}
a3s-dirs = {path = "../a3s-dirs"}
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = {version = "0.10"}

[dev-dependencies]
tempfile = {workspace = true}

[features]

[lints]
workspace = true