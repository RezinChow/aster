[package]
license = "Apache-2.0"
name = "a3s-chat-state"
version = "0.1.0"
description = "Actor-based chat state management for A3S agents"
edition = "2024"
publish = false

[features]
default-bazel = []

[dependencies]
indexmap = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "macros"]}
tokio-util = {workspace = true}
tracing = {workspace = true}
# `CompactionDetail`, embedded in `CompactionMode::Segments`.
a3s-token-estimation = {path = "../a3s-token-estimation"}
a3s-code-sampling-types = {path = "../a3s-code-sampling-types"}
a3s-code-compaction = {path = "../../common/a3s-code-compaction"}
a3s-compaction-transcript = {path = "../a3s-compaction-transcript"}

[dev-dependencies]
tokio = {workspace = true}

[lints]
workspace = true
