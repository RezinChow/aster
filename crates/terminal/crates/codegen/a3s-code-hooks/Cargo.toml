[package]
license = "Apache-2.0"
name = "a3s-code-hooks"
version = "0.1.0"
description = "Runtime hook system for A3S Code — file-based discovery, command execution, and policy enforcement"
edition = "2024"
publish = false

[dependencies]
fastrand = {version = "2"}
regex = {workspace = true}
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
shellexpand = {workspace = true}
strum = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "process", "rt", "macros", "time"]}
toml = {workspace = true}
tracing = {workspace = true}
url = {workspace = true}
# Child-network restriction on hook command spawns; enforce is feature-unified
# from the binary crate, matching the other consumers.
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-sandbox = {default-features = false, path = "../a3s-code-sandbox"}
a3s-code-config = {path = "../a3s-code-config"}
a3s-dirs = {path = "../a3s-dirs"}
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {workspace = true}

[lints]
workspace = true