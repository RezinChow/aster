[package]
license = "Apache-2.0"
name = "a3s-code-http"
version = "0.1.0"
description = "Shared reqwest HTTP clients and User-Agent construction for the grok CLI."
edition = "2024"
publish = false

[dependencies]
reqwest = {version = "0.12", features = ["rustls-tls", "stream", "json", "multipart", "http2", "blocking", "socks", "rustls-tls-native-roots"], default-features = false}
reqwest-middleware = {workspace = true}
# Same 0.23 as reqwest's rustls, so the certificate classifier's downcast resolves.
rustls = {workspace = true}
serde_json = {workspace = true}
tracing = {workspace = true}
a3s-code-workspace = {default-features = false, path = "../a3s-code-workspace"}
a3s-code-version = {path = "../a3s-code-version"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-code-sampler = {path = "../a3s-code-sampler"}
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}
a3s-code-auth = {features = ["middleware"], path = "../a3s-code-auth"}

[dev-dependencies]
rcgen = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "rt-multi-thread"]}

[lints]
workspace = true
