[package]
license = "Apache-2.0"
name = "a3s-code-memory"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exposes `#[cfg(test)]`-only helpers (`MemoryStorage::with_paths`,
# `MockEmbeddingProvider`) to downstream crates' test targets.
test-support = []

[dependencies]
anyhow = {workspace = true}
arc-swap = {workspace = true}
async-trait = {workspace = true}
blake3 = {workspace = true}
chrono = {workspace = true}
dunce = {workspace = true}
flate2 = {workspace = true}
git2 = {workspace = true}
libc = {workspace = true}
notify = {workspace = true}
parking_lot = {workspace = true}
reqwest = {workspace = true}
reqwest-middleware = {workspace = true}
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
rusqlite = {workspace = true}
serde_json = {workspace = true}
# sqlite-vec: vec0 virtual table for KNN vector search.
sqlite-vec = "=0.1.7-alpha.10"
tar = {workspace = true}
tempfile = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "rt", "rt-multi-thread", "time"]}
tracing = {workspace = true}
a3s-token-estimation = {path = "../a3s-token-estimation"}
a3s-sqlite-journal = {path = "../a3s-sqlite-journal"}
a3s-code-version = {path = "../a3s-code-version"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-http = {path = "../a3s-code-http"}
a3s-code-config-types = {path = "../a3s-code-config-types"}
a3s-code-auth = {path = "../a3s-code-auth"}

[target.'cfg(unix)'.dependencies]
nix = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows = {workspace = true}

[dev-dependencies]
filetime = {workspace = true}

[lints]
workspace = true
