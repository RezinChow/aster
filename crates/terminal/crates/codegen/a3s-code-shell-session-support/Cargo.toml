[package]
license = "Apache-2.0"
name = "a3s-code-shell-session-support"
version = "0.1.0"
description = "Session-support modules for the grok shell crate family: managed MCP gateway catalog/call caching and file-access tracking."
edition = "2024"
publish = false

[dependencies]
reqwest = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "time", "macros"]}
tracing = {workspace = true}
a3s-code-version = {path = "../a3s-code-version"}
a3s-code-http = {path = "../a3s-code-http"}
a3s-file-utils = {optional = true, path = "../a3s-file-utils"}

[features]
default-bazel = []

[dev-dependencies]
axum = {workspace = true}
tokio = {version = "1", features = ["full", "net", "rt-multi-thread"]}

[lints]
workspace = true
