[package]
license = "Apache-2.0"
name = "a3s-code-dashboard-store"
version = "0.1.0"
description = "SQLite-backed persistent dashboard workspace: membership, layout ranks, grouping"
edition = "2024"
publish = false

[dependencies]
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2).
# Keep in step with a3s-sqlite-journal (CVE-2025-29087/-3277/-6965 floor).
rusqlite = {workspace = true}
strum = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
a3s-sqlite-journal = {path = "../a3s-sqlite-journal"}
a3s-code-config = {path = "../a3s-code-config"}

[dev-dependencies]
pretty_assertions = {workspace = true}
tempfile = {workspace = true}

[lints]
workspace = true
