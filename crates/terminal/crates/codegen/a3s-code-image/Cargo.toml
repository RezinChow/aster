[package]
name = "a3s-code-image"
version = "0.1.0"
license = "Apache-2.0"
description = "Image validation and transcoding shared by A3S Code tools and clients"
edition = "2024"
publish = false

[dependencies]
crc32fast = {version = "1.4"}
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"]}
thiserror = {workspace = true}

[dev-dependencies]
a3s-test-utils = {path = "../../common/a3s-test-utils"}

[lints]
workspace = true
