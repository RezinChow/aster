[package]
name = "a3s-code-pager"
version = "9.1.4"
license = "Apache-2.0"
authors = ["A3S Lab"]
edition = "2024"
publish = false

[dependencies]
a3s-form-core = { workspace = true }
# TTY safety — detach subprocesses from the controlling terminal
dunce = {workspace = true}

# Shared prompt-queue wire types

# Presentation-primitives layer (extracted)

# The /gboom easter-egg game (extracted)

# Diff hunk construction (extracted)

# Rendering
ratatui = {workspace = true}
crossterm = {workspace = true}
textwrap = {workspace = true}
regex = {workspace = true}
unicode-width = {workspace = true}
unicode-segmentation = {workspace = true}
strip-ansi-escapes = {version = "0.2.1"}

# Markdown / syntax highlighting
# Inline Mermaid rendering engine. Always compiled (no feature gate): the
# dagre-based vendored engine renders detected ```mermaid fences out of process,
# gated only at runtime by the `appearance.render_mermaid` setting.
syntect = {workspace = true}

# Data
similar = {workspace = true}
indexmap = {workspace = true}
blake3 = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
strum = {workspace = true}
toml = {workspace = true}
toml_edit = {version = "0.22", features = ["serde"]}

# ANSI parsing (tracing pane)
ansi-to-tui = {version = "7.0.0"}

# PTY for ssh wrapper, e2e tests, and benchmarking.
portable-pty = {workspace = true}

# Utilities
anyhow = {workspace = true}
thiserror = {workspace = true}
shlex = {version = "1"}
clap = {workspace = true}
clap_complete = {version = "4"}
rand = {workspace = true}
tokio = {version = "1", features = ["full", "sync", "rt", "macros", "rt-multi-thread", "signal", "io-util", "io-std", "process"]}
tokio-stream = {workspace = true, optional = true}
tokio-util = {version = "0.7", features = ["rt", "compat"]}
tempfile = {workspace = true, optional = true}
tracing = {workspace = true}
tracing-subscriber = {workspace = true}

# Binary hardening: compile-time string obfuscation.
# (cryptify / rustls / semver / tikv-jemallocator moved to the composition-root
# binary `a3s-code-pager-bin` with `main.rs`; this lib no longer references them.)
obfstr = {workspace = true}

# Fuzzy matching (history search daemon)
nucleo = {git = "https://github.com/helix-editor/nucleo.git", rev = "5b74652"}

# Prompt text input

# Update

# ACP
agent-client-protocol = {workspace = true}
# Crash-recovery registry of open TUI sessions.
# Voice dictation. `audio` (mic capture) is enabled on every target. On
# macOS/Windows it links cpal; on Linux it compiles a subprocess-recorder
# backend instead, so cpal -> alsa-sys never reaches the static musl binary
# (cpal is target-gated to non-Linux inside a3s-code-voice).
# The status-line contract: the config the user writes and the payload the
# agent sends. A leaf crate rather than the agent's, so the client reads it
# from upstream of the crate that fills it in.
# Foreign coding-agent session discovery.
gethostname = {version = "1", optional = true}
backon = {workspace = true}
chrono = {workspace = true}
flate2 = {workspace = true}
tar = {workspace = true}
# Blocked-card copy: `hook_display_name` lives next to the hook-name grammar.
walkdir = {workspace = true}

# Base64 encoding for image data
base64 = {workspace = true}

# Image decoding/resizing for clipboard image validation before send
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "gif", "webp"]}

# ID generation
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}

# Path computation (plan file, etc.)
shellexpand = {workspace = true}

# libgit2 for the startup git-info populator (no fork/exec, runs once on launch
# in spawn_blocking; the render path never touches git directly).
git2 = {workspace = true}
urlencoding = {workspace = true}

# Parsing (web_search)
url = {workspace = true}

# Crash diagnostics

# Non-poisoning mutex for signal handler (active-sessions crash recovery).

# nix: signal handling in notifications/.
# signal-hook: SIGWINCH handler for the `a3s wrap` PTY wrapper (pty_wrap.rs).
# libc: poll/read for non-blocking terminal reads in theme/osc11.rs.
parking_lot = {workspace = true}
a3s-crash-handler = {path = "../a3s-crash-handler"}
a3s-code-sandbox = {default-features = false, path = "../a3s-code-sandbox"}
a3s-hooks-plugins-types = {path = "../a3s-hooks-plugins-types"}
a3s-code-hooks = {path = "../a3s-code-hooks"}
a3s-code-plugin-marketplace = {path = "../a3s-code-plugin-marketplace"}
a3s-code-agent = {path = "../a3s-code-agent"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-fast-worktree = {features = ["metadata"], path = "../a3s-fast-worktree"}
a3s-code-otel = {path = "../a3s-code-otel"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-token-estimation = {path = "../a3s-token-estimation"}
a3s-code-foreign-sessions = {path = "../a3s-code-foreign-sessions"}
a3s-code-workspace = {default-features = false, path = "../a3s-code-workspace"}
a3s-code-status-line = {path = "../a3s-code-status-line"}
a3s-code-shell = {path = "../a3s-code-shell"}
a3s-code-login = {path = "../a3s-code-login"}
a3s-code-voice = {default-features = false, features = ["audio"], path = "../a3s-code-voice"}
a3s-code-dashboard-store = {path = "../a3s-code-dashboard-store"}
a3s-dirs = {path = "../a3s-dirs"}
a3s-tool-types = {path = "../../common/a3s-tool-types"}
a3s-code-sampling-types = {optional = true, path = "../a3s-code-sampling-types"}
a3s-code-feedback = {path = "../a3s-code-feedback"}
a3s-code-config = {path = "../a3s-code-config"}
a3s-code-active-sessions = {path = "../a3s-code-active-sessions"}
a3s-file-utils = {path = "../a3s-file-utils"}
a3s-chat-state = {optional = true, path = "../a3s-chat-state"}
a3s-acp-lib = {path = "../a3s-acp-lib"}
a3s-code-update = {path = "../a3s-code-update"}
a3s-ratatui-inline = {path = "../a3s-ratatui-inline"}
a3s-ratatui-textarea = {path = "../a3s-ratatui-textarea"}
a3s-acl = {path = "../../../../acl"}
a3s-code-mermaid = {path = "../a3s-code-mermaid"}
a3s-code-markdown = {path = "../a3s-code-markdown"}
a3s-code-announcements = {path = "../a3s-code-announcements"}
a3s-code-pager-diff = {path = "../a3s-code-pager-diff"}
a3s-code-gboom = {path = "../a3s-code-gboom"}
a3s-code-pager-render = {path = "../a3s-code-pager-render"}
a3s-prompt-queue = {path = "../a3s-prompt-queue"}
a3s-code-version = {path = "../a3s-code-version"}
a3s-tty-utils = {path = "../a3s-tty-utils"}
[target.'cfg(unix)'.dependencies]
nix = {workspace = true}
signal-hook = {version = "0.3"}
libc = {workspace = true}

# core-foundation: IOKit power assertions for sleep prevention (SleepInhibitor).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = {version = "0.10"}

# SetConsoleCtrlHandler for the exec-emulating screen-mode relaunch
# (`/minimal` / `/fullscreen`): the waiting parent must ignore console Ctrl
# events so only the relaunched child handles them. Version matches the other
# in-repo consumers (a3s-crash-handler, a3s-system-power).
[target.'cfg(windows)'.dependencies]
windows-sys = {version = "0.59", features = ["Win32_System_Console"]}

[dev-dependencies]
tokio = {version = "1", features = ["full", "test-util"]}
# The fixture that builds a `[ui.status_line]` section field by field.
pretty_assertions = {workspace = true}
wiremock = {workspace = true}
insta = {version = "1"}
criterion = {workspace = true}
tempfile = {workspace = true}
serial_test = {workspace = true}
# In-process leader-cluster harness (mock inference server; no cycle:
# a3s-code-test-support depends on neither the pager nor the shell).
# Provider install for the in-process leader-cluster tests.
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}
a3s-code-test-support = {features = [], path = "../a3s-code-test-support"}
a3s-code-agent = {path = "../a3s-code-agent"}
a3s-code-shell = {features = ["test-support"], path = "../a3s-code-shell"}
a3s-code-login = {features = ["test-support"], path = "../a3s-code-login"}
a3s-code-gboom = {features = ["test-support"], path = "../a3s-code-gboom"}
a3s-ratatui-inline = {features = ["test-support"], path = "../a3s-ratatui-inline"}
a3s-code-pager-render = {features = ["test-support"], path = "../a3s-code-pager-render"}
a3s-code-status-line = {features = ["test-support"], path = "../a3s-code-status-line"}
a3s-interjection-core = {path = "../../common/a3s-interjection-core"}

[[bench]]
name = "render"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "edit_highlight"
harness = false

[[bench]]
name = "resize"
harness = false

# Settings modal regression tests — keyboard/mouse dispatch + registry
# contracts. Not gated by `--ignored`; runs on every `cargo test`.
# Spawn-only pager tests live in `a3s-code-pager-pty-harness`.
[[test]]
name = "settings_e2e"
path = "tests/settings_e2e.rs"

# Opt into [workspace.lints.clippy] (too_many_arguments etc.). Without this,
# `cargo clippy --workspace -- -D warnings` on this package is stricter than
# the workspace-default clippy allows used in CI.
[lints]
workspace = true

[features]
default = ["jemalloc", "sandbox-enforce"]
default-bazel = [
    "jemalloc",
    "sandbox-enforce",
    "test-support",
    "local-workspace",
    ]
local-workspace = ["a3s-code-shell/local-workspace"]
# No-op on this crate: the actual `#[global_allocator]` (and the
# `tikv-jemallocator` dep) live on the composition-root binary
# `a3s-code-pager-bin`, which owns `main.rs`. Kept as an empty feature so the
# workspace-uniform `[jemalloc, sandbox-enforce]` default set resolves
# here too and the generated `crate_features` stay valid.
jemalloc = []
sandbox-enforce = ["a3s-code-sandbox/enforce"]
release-dist = []
# Exposes test-only view-model constructors/setters (e.g. `test_agent_view`,
# `AgentSession::set_yolo_mode_for_test`) to sibling crates' test builds — used
# by `a3s-code-pager-minimal`'s unit tests. Never enabled in production builds.
test-support = ["a3s-code-pager-render/test-support", "a3s-code-gboom/test-support"]
