[package]
license = "Apache-2.0"
name = "a3s-code-workspace"
version = "0.1.220-alpha.4"
description = "Core host-local workspace library (FS, VCS, execution, discovery) for a3s-code-shell and remote sampler"
edition = "2024"
publish = false

[dependencies]
anyhow = {workspace = true}
arc-swap = {workspace = true}
dunce = {workspace = true}
async-stream = {workspace = true}
async-trait = {workspace = true}
futures = {workspace = true}
fs2 = {workspace = true}
parking_lot = {workspace = true}
git2 = {workspace = true}
ignore = {workspace = true}
regex = {workspace = true}
rand = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
strum = {workspace = true}
tokio = {version = "1", features = ["full", "fs", "io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time"]}
tracing = {workspace = true}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
# `DiagHandle`, held by the hub config and threaded through `connect_hub`.
# Daemon/process-lifecycle machinery for `bin/workspace_server.rs` only; the
# library never references it.
# Leaf config value types (RemoteSettings, BoolFlag) for the folder-trust decision.
toml = {version = "0.9", features = ["preserve_order"]}
dashmap = {workspace = true}
agent-client-protocol = {workspace = true}
base64 = {workspace = true}
infer = {version = "0.19.0"}
sha2 = {version = "0.10", features = ["force-soft"]}
bstr = "1.12.1"
hashbrown = "0.16.1"
nohash-hasher = "0.2.0"
rustc-hash = "2.1.1"
# Backs `file_system`'s fuzzy path picker (matcher + background daemon).
indexmap = {workspace = true}
smallvec = {version = "1"}
chrono = {workspace = true}
tree-sitter = {version = "0.26"}
tree-sitter-bash = "0.25"
url = {workspace = true}
humantime-serde = {version = "1"}
prometheus = {workspace = true}
glob = {workspace = true}
# `metrics` enables the SDK's metric-donation client (periodic Prometheus
# registry gather → OTLP → hub donation pump); see metric_donation_reporter.
reqwest = {workspace = true}
tokio-util = {workspace = true}
urlencoding = {workspace = true}
# tonic: Status/Code mapping for deploy errors in workspace_ops.
tonic = {workspace = true}
sha1 = {version = "0.10", optional = true}
zip = {version = "3", optional = true}

clap = {workspace = true}
tracing-subscriber = {workspace = true}
# "enable" required for the SDK's spans to record at all.
fastrace = {version = "0.7", features = ["enable"]}
tokio-tungstenite = {version = "0.28", features = ["rustls-tls-webpki-roots"]}
tempfile = {workspace = true}
zstd = {workspace = true}
wait-timeout = {version = "0.2"}

# Raw fd/dirent/poll calls in foreign-session capability probes, the fuzzy
# walker's rlimit guard, and the envrc reader.
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}
a3s-tracing = {path = "../../common/a3s-tracing"}
a3s-fsnotify = {path = "../a3s-fsnotify"}
a3s-fast-worktree = {features = ["metadata"], path = "../a3s-fast-worktree"}
a3s-tool-types = {path = "../../common/a3s-tool-types"}
a3s-tool-runtime = {path = "../../common/a3s-tool-runtime"}
a3s-tool-protocol = {path = "../../common/a3s-tool-protocol"}
a3s-tty-utils = {path = "../a3s-tty-utils"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-code-auth = {path = "../a3s-code-auth"}
a3s-code-session-events = {path = "../a3s-code-session-events"}
a3s-file-utils = {path = "../a3s-file-utils"}
a3s-code-mcp = {path = "../a3s-code-mcp"}
a3s-computer-hub-mcp-adapter = {path = "../../common/a3s-computer-hub-mcp-adapter"}
a3s-computer-hub-sdk = {features = ["metrics"], path = "../../common/a3s-computer-hub-sdk"}
a3s-hunk-tracker = {path = "../a3s-hunk-tracker"}
a3s-code-hooks = {path = "../a3s-code-hooks"}
a3s-code-sandbox = {default-features = false, path = "../a3s-code-sandbox"}
a3s-code-env = {path = "../a3s-code-env"}
a3s-fuzzy-file-search = {path = "../a3s-fuzzy-file-search"}
a3s-code-paths = {path = "../a3s-code-paths"}
a3s-codebase-graph = {path = "../a3s-codebase-graph"}
a3s-acp-lib = {path = "../a3s-acp-lib"}
a3s-code-config-types = {path = "../a3s-code-config-types"}
a3s-dirs = {path = "../a3s-dirs"}
a3s-code-config = {path = "../a3s-code-config"}
a3s-code-workspace-types = {path = "../a3s-code-workspace-types"}
a3s-code-workspace-daemon = {path = "../a3s-code-workspace-daemon"}
a3s-code-workspace-client = {path = "../a3s-code-workspace-client"}
a3s-code-diag-server = {path = "../a3s-code-diag-server"}
a3s-code-tools-api = {path = "../a3s-code-tools-api"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-agent = {path = "../a3s-code-agent"}
a3s-code-version = {path = "../a3s-code-version"}
[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[target.'cfg(unix)'.dev-dependencies]
nix = {workspace = true}

[[bin]]
name = "a3s-workspace-server"
path = "src/bin/workspace_server.rs"

[[bin]]
name = "workspace-server-probe"
path = "src/bin/workspace_server_probe.rs"

[features]
default = ["sandbox-enforce"]
compression = []
test-support = []
test-util = []
sandbox-enforce = ["a3s-code-sandbox/enforce"]
default-bazel = [
    "sandbox-enforce",
    ]

[dev-dependencies]
tempfile = {workspace = true}
axum = {workspace = true}
tokio = {version = "1", features = ["full", "test-util"]}
# Decode tar.gz archives produced by workspace upload helpers in tests.
flate2 = {workspace = true}
tar = {workspace = true}
a3s-test-utils = {path = "../../common/a3s-test-utils"}

[package.metadata.cargo-shear]
ignored = ["tokio-tungstenite"]

[lints]
workspace = true
