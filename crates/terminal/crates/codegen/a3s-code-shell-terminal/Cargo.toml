[package]
license = "Apache-2.0"
name = "a3s-code-shell-terminal"
version = "0.1.0"
description = "Local, ACP, and PTY terminal runners extracted from a3s-code-shell so they compile in parallel."
edition = "2024"
publish = false

[dependencies]
agent-client-protocol = {workspace = true}
async-trait = {workspace = true}
base64 = {workspace = true}
chrono = {workspace = true}
futures = {workspace = true}
portable-pty = {workspace = true}
process-wrap = {version = "9.0.0", features = ["tokio1", "job-object", "creation-flags"]}
serde = {workspace = true}
serde_json = {workspace = true}
shlex = {version = "1"}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "fs", "io-util", "macros", "process", "sync", "time"]}
tracing = {workspace = true}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
a3s-tty-utils = {path = "../a3s-tty-utils"}
a3s-code-workspace = {default-features = false, path = "../a3s-code-workspace"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-sandbox = {default-features = false, path = "../a3s-code-sandbox"}
a3s-code-paths = {path = "../a3s-code-paths"}
a3s-code-config = {path = "../a3s-code-config"}
a3s-acp-lib = {path = "../a3s-acp-lib"}

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}

[target.'cfg(windows)'.dependencies]
windows = {workspace = true}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["full", "test-util"]}

[lints]
workspace = true
