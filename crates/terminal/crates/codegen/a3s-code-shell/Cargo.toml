[package]
license = "Apache-2.0"
name = "a3s-code-shell"
version = "1.0.41"
edition = "2024"
publish = false

[features]
default = []
dhat-heap = ["dep:dhat"]
# Session synthesis + in-process e2e harness (`session::testkit`) for soak,
# load, and bench tests. Off by default; the tests/benches that use it declare
# it via `required-features`. Forwards login, sampler, and workspace
# `test-support` so downstream test builds see those crates' test seams
# (`isolated_spawn_e2e` uses `WorkspaceOps::for_test`).
test-support = [
    "a3s-code-login/test-support",
    "a3s-code-sampler/test-support",
    "a3s-code-workspace/test-support",
]
test-util = []
# Local Computer Hub workspace_server (own/attach + crash-restart). Requires
local-workspace = []
# CI default set (preferred over cargo `default` for hermetic CI builds):
# `config-docs` is on this set (not cargo `default`) so hermetic lib tests
# parse the committed config-reference page.
config-docs = []
default-bazel = [
    "local-workspace",
    "test-support",
    "config-docs",
]

[dependencies]
dunce = {workspace = true}
agent-client-protocol = {workspace = true}
anyhow = {workspace = true}

async-openai = {workspace = true}
async-trait = {workspace = true}
blake3 = {workspace = true}
bm25 = "2.3"
bytes = {workspace = true}
chrono = {workspace = true}
indexmap = {workspace = true}
ignore = {workspace = true}
jsonschema = {version = "0.30.0"}
futures = {workspace = true}
glob = {workspace = true}
globset = {workspace = true}
kanal = "0.1"
regex = {workspace = true}
# rmcp 2.1 + reqwest 0.13 are quarantined inside `a3s-code-mcp`. The remaining
# MCP code in this crate (extensions/mcp.rs, mcp_doctor.rs) reaches rmcp model
# types via `a3s_code_mcp::rmcp::model::*`. reqwest 0.13 is a private impl
# detail of a3s-code-mcp::servers; shell never sees it. Every HTTP call site
# in this crate uses workspace reqwest 0.12.
reqwest = {workspace = true}
reqwest-middleware = {workspace = true}
serde = {workspace = true}
serde_ignored = "0.1"
serde_json = {version = "1", features = ["preserve_order"]}
thiserror = {workspace = true}
clap = {workspace = true}
toml = {version = "0.9", features = ["preserve_order"]}
toml_edit = {version = "0.22"}
tokio = {version = "1", features = ["full", "io-std", "process", "rt", "macros", "rt-multi-thread", "net", "sync"]}
tracing = {workspace = true}
tracing-subscriber = {version = "0.3.23", default-features = false, features = ["env-filter", "smallvec", "tracing-log", "std", "ansi", "fmt", "json", "time"]}
obfstr = {workspace = true}
tokio-util = {version = "0.7", features = ["rt", "compat"]}
tokio-retry = {version = "0.3"}
uuid = {version = "1", features = ["serde", "v4", "v5", "v7"]}
axum = {version = "0.8", features = ["macros", "ws", "multipart"]}
backon = {workspace = true}
webbrowser = {workspace = true}
tokio-tungstenite = {version = "0.28", features = ["rustls-tls-native-roots"]}
tokio-rustls = {version = "0.26", default-features = false, features = [
    "ring",
    "logging",
    "tls12",
]}
rustls = {version = "0.23", default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
]}
futures-util = {workspace = true}
urlencoding = {workspace = true}
gethostname = {version = "1"}
gcloud-storage = {version = "1.3.0", default-features = false, features = ["auth", "jwt-aws-lc-rs", "external-account"]}
git2 = {workspace = true}
notify = {workspace = true}
notify-debouncer-mini = {version = "0.6"}
nucleo = {git = "https://github.com/helix-editor/nucleo.git", rev = "5b74652"}
arc-swap = {workspace = true}
infer = "0.15"
image = {version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"]}
moka = {version = "0.12", features = ["future"]}
dhat = {version = "0.3", optional = true}
base64 = {workspace = true}
hmac = {version = "0.12"}
sha2 = {version = "0.10", features = ["force-soft"]}
strum = {workspace = true}

# Segment markdown rendering + the `compaction/` store path convention.
# Leader lock: bounded flock polling behind the machine-local acquire slot.
# Session FTS search; owns this crate's only rusqlite/bundled-SQLite use.
# Backs the compatibility-only `a3s_code_shell::foreign_sessions` re-export.
prod-mc-cli-chat-proxy-types = {path = "../../../prod/mc/cli-chat-proxy-types"}
flate2 = {workspace = true}
fs2 = {workspace = true}
zstd = {workspace = true}
tar = {workspace = true}
url = {workspace = true}
walkdir = {workspace = true}
tdigests = "1.0"
semver = {workspace = true}

# Used by acp_session.rs and mcp_servers.rs for the unified
# a3s_tool_runtime::Tool dispatch model and the computer-hub MCP adapter.
parking_lot = {workspace = true}
dashmap = {workspace = true}
tempfile = {workspace = true}
a3s-tool-types = {path = "../../common/a3s-tool-types"}
a3s-tool-protocol = {path = "../../common/a3s-tool-protocol"}
a3s-tool-runtime = {path = "../../common/a3s-tool-runtime"}
a3s-computer-hub-sdk = {path = "../../common/a3s-computer-hub-sdk"}
a3s-code-models = {path = "../a3s-code-models"}
a3s-code-login = {path = "../a3s-code-login"}
a3s-code-http = {path = "../a3s-code-http"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-code-auth = {features = ["middleware"], path = "../a3s-code-auth"}
a3s-code-session-events = {path = "../a3s-code-session-events"}
a3s-code-otel = {path = "../a3s-code-otel"}
a3s-file-utils = {path = "../a3s-file-utils"}
a3s-code-plugin-marketplace = {path = "../a3s-code-plugin-marketplace"}
a3s-hooks-plugins-types = {path = "../a3s-hooks-plugins-types"}
a3s-code-hooks = {path = "../a3s-code-hooks"}
a3s-code-memory = {path = "../a3s-code-memory"}
a3s-dirs = {path = "../a3s-dirs"}
a3s-code-env = {path = "../a3s-code-env"}
a3s-code-config-types = {path = "../a3s-code-config-types"}
a3s-code-feedback = {path = "../a3s-code-feedback"}
a3s-code-config = {path = "../a3s-code-config"}
a3s-code-bundle = {path = "../a3s-code-bundle"}
a3s-code-agent = {path = "../a3s-code-agent"}
a3s-code-subagent-resolution = {path = "../a3s-code-subagent-resolution"}
a3s-code-foreign-sessions = {path = "../a3s-code-foreign-sessions"}
a3s-code-workspace = {default-features = false, path = "../a3s-code-workspace"}
a3s-workflow = {path = "../a3s-workflow"}
a3s-tty-utils = {path = "../a3s-tty-utils"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-sampling-types = {path = "../a3s-code-sampling-types"}
a3s-token-estimation = {path = "../a3s-token-estimation"}
a3s-code-session-search = {path = "../a3s-code-session-search"}
a3s-code-sampler = {path = "../a3s-code-sampler"}
a3s-code-file-lock = {path = "../a3s-code-file-lock"}
a3s-code-extra-ca = {path = "../a3s-code-extra-ca"}
a3s-code-compaction = {path = "../../common/a3s-code-compaction"}
a3s-compaction-transcript = {path = "../a3s-compaction-transcript"}
a3s-chat-state = {path = "../a3s-chat-state"}
a3s-code-sandbox = {default-features = false, path = "../a3s-code-sandbox"}
a3s-message-delivery-core = {path = "../../common/a3s-message-delivery-core"}
a3s-interjection-core = {path = "../../common/a3s-interjection-core"}
a3s-agent-lifecycle = {path = "../a3s-agent-lifecycle"}
a3s-hunk-tracker = {path = "../a3s-hunk-tracker"}
a3s-codebase-graph = {path = "../a3s-codebase-graph"}
a3s-fsnotify = {path = "../a3s-fsnotify"}
a3s-tracing-macros = {path = "../a3s-tracing-macros"}
a3s-code-status-line = {path = "../a3s-code-status-line"}
a3s-code-shared = {path = "../a3s-code-shared"}
a3s-code-shell-terminal = {path = "../a3s-code-shell-terminal"}
a3s-code-shell-session-support = {path = "../a3s-code-shell-session-support"}
a3s-code-shell-base = {path = "../a3s-code-shell-base"}
a3s-code-paths = {path = "../a3s-code-paths"}
a3s-fast-worktree = {features = ["metadata"], path = "../a3s-fast-worktree"}
a3s-acp-lib = {path = "../a3s-acp-lib"}
a3s-code-mcp = {path = "../a3s-code-mcp"}
a3s-code-version = {path = "../a3s-code-version"}
a3s-prompt-queue = {path = "../a3s-prompt-queue"}
a3s-code-announcements = {path = "../a3s-code-announcements"}

[target.'cfg(unix)'.dependencies]
libc = {workspace = true}
nix = {workspace = true}

[target.'cfg(windows)'.dependencies]
siphasher = {version = "1"}
windows = {workspace = true}

[dev-dependencies]
criterion = {workspace = true}
# Pre-main unified-log redirect (`test_support::redirect_unified_log_for_tests`).
ctor = {version = "0.4"}
filetime = {workspace = true}
pretty_assertions = {workspace = true}
tempfile = {workspace = true}
# `extensions::bundle` tests build archives with `bundle::test_helpers`, which
# is `#[cfg(test)]`-only inside a3s-code-bundle without this feature.
# sandbox-enforce: keep tests running against the enforcing sandbox build.
tar = {workspace = true}
flate2 = {workspace = true}
semver = {workspace = true}
serial_test = {workspace = true}
# Test-only builds expose `env::EnvVarGuard` and the cpu_profile test seams to
# this crate's test targets.
# Exposes the login crate's `#[cfg(test)]`-only auth-provider helpers
# (`test_counting_provider`, `test_backdate_provider_mint`) to shell tests.
# Exposes sampler's `notify_on_submit` mock to lib tests via feature unification.
# `test-util` enables `#[tokio::test(start_paused = true)]` (paused virtual
# clock with auto-advance) so interval-driven loop tests in `auth::refresh`
# can assert exact tick counts deterministically without real-time sleep.
tokio = {version = "1", features = ["full", "test-util"]}
a3s-test-utils = {path = "../../common/a3s-test-utils"}
a3s-code-test-support = {features = [], path = "../a3s-code-test-support"}
a3s-code-sampler = {features = ["test-support"], path = "../a3s-code-sampler"}
a3s-code-login = {features = ["test-support"], path = "../a3s-code-login"}
a3s-code-shell-base = {features = ["test-support"], path = "../a3s-code-shell-base"}
a3s-code-config = {features = [], path = "../a3s-code-config"}
a3s-code-workspace = {default-features = false, features = ["test-support", "sandbox-enforce"], path = "../a3s-code-workspace"}
a3s-code-memory = {features = ["test-support"], path = "../a3s-code-memory"}
a3s-code-bundle = {features = ["test-support"], path = "../a3s-code-bundle"}
a3s-code-status-line = {features = ["test-support"], path = "../a3s-code-status-line"}
a3s-dirs = {path = "../a3s-dirs"}

[[bench]]
name = "session_list"
harness = false

[[bench]]
name = "fork_copy"
harness = false
required-features = ["test-support"]

[[bench]]
name = "skills_watcher_startup"
harness = false

[[bench]]
name = "child_replay_lookup"
harness = false

# Ordinary integration tests live in `tests/all.rs` (`mod suite`) so cargo
# links one binary. The test name is `a3s-code-shell-all` (Bazel `//pkg:all`
# is the package wildcard). Process-isolated suites stay as implicit
# `tests/*.rs` binaries.
[[test]]
name = "test_startup_prefetch_fallback"
required-features = ["test-support"]

[[test]]
name = "test_startup_prefetch_overlap"
required-features = ["test-support"]

