[package]
license = "Apache-2.0"
name = "a3s-code-workspace-client"
version = "0.1.0"
description = "Lightweight typed client for hub-proxied workspace.* RPCs (shared by a3s-code-shell proxy mode and other consumers)"
edition = "2024"
publish = false

[dependencies]
semver = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tokio = {version = "1", features = ["full", "time"]}
tracing = {workspace = true}
a3s-tool-runtime = {path = "../../common/a3s-tool-runtime"}
a3s-tool-protocol = {path = "../../common/a3s-tool-protocol"}
a3s-code-workspace-types = {path = "../a3s-code-workspace-types"}
a3s-computer-hub-sdk = {path = "../../common/a3s-computer-hub-sdk"}

[features]
default = []
default-bazel = []
[dev-dependencies]
schemars = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "rt", "test-util"]}
a3s-tool-types = {path = "../../common/a3s-tool-types"}

[lints]
workspace = true
