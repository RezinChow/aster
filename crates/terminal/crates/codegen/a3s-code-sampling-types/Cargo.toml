[package]
license = "Apache-2.0"
name = "a3s-code-sampling-types"
version = "0.1.0"
description = "Pure data types for the A3S sampling / chat-completion API layer"
edition = "2024"
publish = false

[dependencies]
async-openai = {workspace = true}
chrono = {workspace = true}
indexmap = {workspace = true}
reqwest = {workspace = true}
schemars = {workspace = true}
serde = {workspace = true}
serde_json = {version = "1", features = ["preserve_order"]}
strum = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
a3s-tool-types = {path = "../../common/a3s-tool-types"}
a3s-code-compaction = {path = "../../common/a3s-code-compaction"}
a3s-circuit-breaker = {path = "../../common/a3s-circuit-breaker"}

[dev-dependencies]
assert_matches = {version = "1.5.0"}

[lints]
workspace = true
