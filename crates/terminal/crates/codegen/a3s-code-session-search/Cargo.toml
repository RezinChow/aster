[package]
license = "Apache-2.0"
name = "a3s-code-session-search"
version = "0.1.0"
description = "SQLite FTS5 index over local grok sessions: lease-guarded bootstrap, debounced incremental upserts, and BM25 ranked query"
edition = "2024"
publish = false

[dependencies]
async-trait = {workspace = true}
blake3 = {workspace = true}
chrono = {workspace = true}
fs2 = {workspace = true}
parking_lot = {workspace = true}
# rusqlite 0.37 + bundled = self-contained SQLite (>= 3.50.2) with FTS5.
# Pinned to 0.32 elsewhere resolved CVE-2025-29087, CVE-2025-3277,
# CVE-2025-6965; keep this in step with a3s-sqlite-journal.
rusqlite = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "rt", "sync", "time"]}
tracing = {workspace = true}
uuid = {workspace = true}
a3s-sqlite-journal = {path = "../a3s-sqlite-journal"}
a3s-code-telemetry = {path = "../a3s-code-telemetry"}
a3s-code-config = {path = "../a3s-code-config"}

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["full", "rt-multi-thread"]}

[lints]
workspace = true
