[package]
license = "Apache-2.0"
name = "a3s-code-subagent-resolution"
version = "0.1.0"
description = "Shared subagent definition, runtime, prompt, and resume resolution"
edition = "2024"
publish = false

[dependencies]
chrono = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
thiserror = {workspace = true}
tracing = {workspace = true}
a3s-tool-types = {path = "../../common/a3s-tool-types"}
a3s-code-tools = {path = "../a3s-code-tools"}
a3s-code-sampling-types = {path = "../a3s-code-sampling-types"}
a3s-code-agent = {path = "../a3s-code-agent"}

[features]
default = []

[dev-dependencies]
tempfile = {workspace = true}
tokio = {version = "1", features = ["full", "macros", "rt"]}
toml = {workspace = true}

[lints]
workspace = true
