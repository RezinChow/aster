[package]
license = "Apache-2.0"
name = "a3s-tool-runtime"
version = "0.1.0"
description = "Unified Tool trait, dispatch trait, error taxonomy, notifications, and search index for the A3S Computer Hub"
edition = "2024"
publish = false

[dependencies]
anyhow = {workspace = true}
async-trait = {workspace = true}
futures = {workspace = true}
schemars = {workspace = true}
serde = {workspace = true}
serde_json = {workspace = true}
tokio-util = {workspace = true}
a3s-tool-types = {path = "../a3s-tool-types"}
a3s-tool-protocol = {path = "../a3s-tool-protocol"}
a3s-code-tools-api = {path = "../../codegen/a3s-code-tools-api"}

[dev-dependencies]
tokio = {version = "1", features = ["full", "rt", "rt-multi-thread", "macros", "test-util"]}

[lints]
workspace = true
