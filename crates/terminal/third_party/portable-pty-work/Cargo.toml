# portable-pty 0.9.0, with one Windows change in src/win/psuedocon.rs:
# CreateProcessW also passes CREATE_NO_WINDOW so a GUI parent does not
# open a console for the ConPTY child. The pseudoconsole attribute still
# owns the console session.
[package]
edition = "2018"
name = "aster-work-pty"
version = "0.9.0"
authors = ["Wez Furlong"]
description = "Cross platform pty interface"
license = "MIT"
repository = "https://github.com/wezterm/wezterm"
publish = false

[lib]
name = "portable_pty"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
downcast-rs = "1.0"
filedescriptor = "0.8.3"
libc = "0.2"
log = "0.4"
nix = {version = "0.28", features = ["term", "fs"]}
serial2 = "0.2"
shell-words = "1.1"
serde = {version = "1.0", optional = true}
serde_derive = {version = "1.0", optional = true}

[target.'cfg(windows)'.dependencies]
bitflags = "1.3"
lazy_static = "1.4"
shared_library = "0.1"
winapi = {version = "0.3", features = ["winuser", "consoleapi", "handleapi", "fileapi", "namedpipeapi", "synchapi"]}
winreg = "0.10"

[features]
default = []
serde_support = ["serde", "serde_derive"]
