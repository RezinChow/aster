[package]
name = "aster-flow-legacy"
version = "1.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["A3S Lab"]
license = "MIT"
description = "Durable workflow engine and Rust SDK for A3S"
repository = "https://github.com/A3S-Lab/Flow"
documentation = "https://docs.rs/a3s-flow"
readme = "README.md"
keywords = ["workflow", "durable", "event-sourcing", "async", "sdk"]
categories = ["asynchronous", "development-tools"]
publish = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "a3s_flow"
path = "src/lib.rs"

[features]
default = ["native-ts"]
native-ts = []
a3s-event = ["dep:a3s-event"]
boot = ["dep:a3s-boot"]
sqlite = ["dep:a3s-orm", "a3s-orm/sqlite"]
postgres = ["dep:a3s-orm", "a3s-orm/postgres"]

[dependencies]
async-trait = {workspace = true}
chrono = {version = "0.4", features = ["serde"]}
serde = {workspace = true}
serde_json = {workspace = true}
serde_yaml_ng = "0.10"
semver = {workspace = true}
sha2 = {workspace = true}
thiserror = "1"
tracing = {workspace = true}
uuid = {version = "1", features = ["serde", "v4"]}
tokio = {version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"]}
a3s-orm = {optional = true, default-features = false, path = "../orm"}
a3s-event = {optional = true, default-features = false, path = "../event"}
a3s-boot = {optional = true, default-features = false, features = ["queue"], path = "../boot"}

[dev-dependencies]
tokio = {version = "1", features = ["macros", "rt", "sync", "time"]}
tempfile = {workspace = true}
