[package]
name = "a3s-office"
description = "Native OOXML document operations for A3S Office"
version = "0.45.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/A3S-Lab/Office"
authors = ["A3S Lab"]
rust-version = "1.85"
publish = false

[features]
default = []
pdfium = ["dep:libloading", "dep:pdfium-render", "dep:png"]

[dependencies]
zip = {version = "2", default-features = false, features = ["deflate"]}
yrs = {version = "=0.27.3", features = ["sync"]}
url = {version = "2"}
tokio = {version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "process", "signal", "sync", "time"]}
tempfile = {version = "3"}
sha2 = {version = "0.10"}
serde_json = {version = "1"}
serde = {version = "1", features = ["derive"]}
ryu-js = {version = "1"}
reqwest = {version = "0.12", default-features = false, features = ["rustls-tls", "stream"]}
regex = {version = "1"}
quick-xml = {version = "0.38"}
png = {version = "0.17", optional = true}
pdfium-render = {version = "=0.9.3", default-features = false, features = ["pdfium_7881", "thread_safe"], optional = true}
libloading = {version = "=0.8.9", optional = true}
fs2 = {version = "0.4"}
base64 = {version = "0.22"}
async-trait = {version = "0.1"}
a3s-use-core = {path = "../../../use/core"}
a3s-office-formula-parser = {path = "../formula-parser"}
[dev-dependencies]
png = {version = "0.17"}
