<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
  <head>
    <script>
      (function () {
        try {
          var tenantSlug = "<%= tenantSlug %>";
          if (!tenantSlug) return;
          document.documentElement.dataset.tenant = tenantSlug;
          var theme = localStorage.getItem('kense.os.theme');
          var locale = localStorage.getItem('kense.os.locale');
          theme = theme === 'dark' || theme === 'light' ? theme : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.lang =
            locale === 'en' ? 'en' : 'zh-CN';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="<%= mountId %>"></div>
  </body>
</html>
