name: Release aster-acp

# Core/ACP only. Aster CLI and Desktop use separate product namespaces.
# Tag, Release, and archive prefix share aster-acp-vX.Y.Z.
on:
  workflow_dispatch:
  push:
    tags:
      - "aster-acp-v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  actions: read

concurrency:
  group: aster-acp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualified:
    name: Verify pre-merge qualification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful branch qualification for the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          successful_runs="$(gh api "repos/${GH_REPO}/actions/workflows/qualify-code.yml/runs?head_sha=${RELEASE_SHA}&event=push&status=completed&per_page=100" --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .head_branch != \"${RELEASE_TAG}\")] | length")"
          if [[ "$successful_runs" -eq 0 ]]; then
            echo "refusing release: tagged commit $RELEASE_SHA has no successful pre-merge Aster Code qualification run" >&2
            exit 1
          fi

  build:
    name: ACP release (${{ matrix.platform }})
    needs: qualified
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            platform: linux-musl
            target: x86_64-unknown-linux-musl
            machine: x86_64
          - os: ubuntu-24.04-arm
            platform: linux-musl-arm64
            target: aarch64-unknown-linux-musl
            machine: aarch64
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned workspace sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev curl xz-utils binutils
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add "${{ matrix.target }}"
      - name: Shorten Windows Cargo home
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'CARGO_HOME=D:\c' >> "$GITHUB_ENV"
      - name: Cache Core/ACP release dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: code-release-${{ matrix.platform }}
          save-if: "true"
      - name: Install pinned Zig musl toolchain
        if: startsWith(matrix.platform, 'linux-musl')
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              zig_archive=x86_64-linux
              zig_sha=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
              ;;
            aarch64)
              zig_archive=aarch64-linux
              zig_sha=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
              ;;
            *) echo "unsupported Zig host: $(uname -m)" >&2; exit 1 ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              zig_target=x86_64-linux-musl
              rust_env=x86_64_unknown_linux_musl
              linker_var=CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
              ;;
            aarch64-unknown-linux-musl)
              zig_target=aarch64-linux-musl
              rust_env=aarch64_unknown_linux_musl
              linker_var=CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
              ;;
            *) echo "unsupported musl target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-${zig_archive}-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$zig_sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          zig_home="$RUNNER_TEMP/zig"
          mkdir -p "$zig_home"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_home" --strip-components=1
          cat > "$RUNNER_TEMP/zig-link" <<EOF
          #!/bin/sh
          exec "$zig_home/zig" cc -target "$zig_target" "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/zig-link"
          {
            echo "CRATE_CC_NO_DEFAULTS=1"
            echo "CC_${rust_env}=$zig_home/zig cc -target $zig_target"
            echo "CXX_${rust_env}=$zig_home/zig c++ -target $zig_target"
            echo "${linker_var}=$RUNNER_TEMP/zig-link"
            echo "${linker_var%LINKER}RUSTFLAGS=-C force-unwind-tables=yes -C relro-level=full -C link-self-contained=no"
          } >> "$GITHUB_ENV"
      - name: Build locked ACP release
        shell: bash
        run: cargo build --locked --release --target "${{ matrix.target }}" -p aster-acp --bin aster-acp
      - name: Verify static musl ACP and native startup
        if: startsWith(matrix.platform, 'linux-musl')
        shell: bash
        run: python3 tests/acp_musl.py --machine "${{ matrix.machine }}" "target/${{ matrix.target }}/release/aster-acp"
      - name: Package ACP binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/acp/Cargo.toml", "rb"))["package"]["version"])')"
          tar -czf "aster-acp-v${version}-${{ matrix.platform }}.tar.gz" -C "target/${{ matrix.target }}/release" aster-acp
      - name: Package ACP binary for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $manifest = Get-Content "crates/code/acp/Cargo.toml" -Raw
          if ($manifest -notmatch '(?m)^version = "([^"]+)"') { throw "ACP version missing" }
          Compress-Archive -Path "target/${{ matrix.target }}/release/aster-acp.exe" -DestinationPath "aster-acp-v$($Matches[1])-windows.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-acp-${{ matrix.platform }}
          path: aster-acp-v*
          if-no-files-found: error

  publish:
    name: Publish Core/ACP source release
    needs: build
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'aster-acp-v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-acp-*
          merge-multiple: true
          path: dist
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#aster-acp-v}"
          acp_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/acp/Cargo.toml", "rb"))["package"]["version"])')"
          core_version="$(python3 -c 'import tomllib; print(tomllib.load(open("crates/code/core/Cargo.toml", "rb"))["package"]["version"])')"
          if ! test "$version" = "$acp_version"; then
            echo "release tag version $version does not match ACP $acp_version" >&2
            exit 1
          fi
          if ! test "$version" = "$core_version"; then
            echo "release tag version $version does not match Core $core_version" >&2
            exit 1
          fi
          notes="crates/code/manual/RELEASE_${version}.md"
          if [[ ! -f "$notes" ]]; then
            echo "release notes missing: $notes" >&2
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 5 ]]; then
            echo "expected 5 ACP release archives, found ${#files[@]}" >&2
            exit 1
          fi
          for asset in "aster-acp-v${version}-macos.tar.gz" "aster-acp-v${version}-linux.tar.gz" "aster-acp-v${version}-linux-musl.tar.gz" "aster-acp-v${version}-linux-musl-arm64.tar.gz" "aster-acp-v${version}-windows.zip"; do
            if [[ ! -f "dist/$asset" ]]; then
              echo "missing ACP release archive: $asset" >&2
              exit 1
            fi
          done
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --latest=false \
            --title "aster-acp v${version}" \
            --notes-file "$notes" \
            "${files[@]}" dist/SHA256SUMS
          gh release view "${GITHUB_REF_NAME}"
