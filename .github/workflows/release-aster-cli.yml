name: Release aster-cli

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Publish archives already uploaded by this run. Leave empty to build them.
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency:
  group: aster-cli-v0.1.3
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.artifact_run_id == '' }}
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            asset: aster-cli-v0.1.3-macos.tar.gz
          - os: ubuntu-latest
            platform: linux
            asset: aster-cli-v0.1.3-linux.tar.gz
          - os: windows-latest
            platform: windows
            asset: aster-cli-v0.1.3-windows.zip
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just
      - name: Install Windows protoc
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "29.3"
          $zip = Join-Path $env:RUNNER_TEMP "protoc.zip"
          $dest = Join-Path $env:RUNNER_TEMP "protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v$version/protoc-$version-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dest
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $dest "bin")
      - name: Install pinned toolchain
        shell: bash
        run: rustup show active-toolchain
      - name: Build locked release
        shell: bash
        run: env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          if [[ -n "${CARGO_TARGET_DIR:-}" ]]; then
            bin_dir="${CARGO_TARGET_DIR}/release"
          else
            bin_dir="target/release"
          fi
          bash scripts/package-aster-cli.sh "${{ matrix.platform }}" "$bin_dir" "${{ matrix.asset }}"
      - name: Verify Windows pair installation and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/cli_pair_delivery.ps1 -Archive "${{ matrix.asset }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # The linux archive is built on ubuntu-latest, so its binaries need the glibc of
  # that release. Kylin V10 SP1 runs glibc 2.31 and cannot start them, so this job
  # builds the same pair inside the oldest still-supported glibc that Aster targets
  # and refuses the archive if a newer symbol slips in (scripts/check-glibc-symbols.py
  # runs from scripts/package-aster-cli.sh for the `kylin` platform).
  build-kylin:
    if: ${{ inputs.artifact_run_id == '' }}
    name: kylin
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container: ubuntu:20.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install container build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config protobuf-compiler \
            python3 libssl-dev
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Confirm the container glibc
        shell: bash
        run: |
          set -euo pipefail
          version="$(getconf GNU_LIBC_VERSION | awk '{print $2}')"
          echo "container glibc ${version}"
          case "$version" in
            2.31) ;;
            *) echo "error: this job must build on glibc 2.31, found ${version}" >&2; exit 1 ;;
          esac
      - name: Install pinned toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          . "$HOME/.cargo/env"
          rustup show active-toolchain
      - name: Build locked release
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          env -u GROK_VERSION cargo build --locked --release -p aster -p a3s-code-acp
      - name: Package aster-cli archive
        shell: bash
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bin_dir="${CARGO_TARGET_DIR:-target}/release"
          bash scripts/package-aster-cli.sh kylin "$bin_dir" "aster-cli-v0.1.3-kylin.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aster-cli-kylin
          path: aster-cli-v0.1.3-kylin.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [build, build-kylin]
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') && (needs.build-kylin.result == 'success' || needs.build-kylin.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: aster-cli-*
          merge-multiple: true
          path: dist
          run-id: ${{ inputs.artifact_run_id != '' && inputs.artifact_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Assemble draft aster-cli v0.1.3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*)
          if [[ ${#files[@]} -ne 4 ]]; then
            echo "expected 4 release archives, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]:-}" >&2
            exit 1
          fi
          macos_sha="$(sha256sum -b dist/aster-cli-v0.1.3-macos.tar.gz | cut -d' ' -f1)"
          linux_sha="$(sha256sum -b dist/aster-cli-v0.1.3-linux.tar.gz | cut -d' ' -f1)"
          kylin_sha="$(sha256sum -b dist/aster-cli-v0.1.3-kylin.tar.gz | cut -d' ' -f1)"
          windows_sha="$(sha256sum -b dist/aster-cli-v0.1.3-windows.zip | cut -d' ' -f1)"
          # Compact single-line manifest: scripts/install.sh parses this exact shape.
          printf '{"version":"0.1.3","tag":"aster-cli-v0.1.3","assets":{"macos":{"name":"aster-cli-v0.1.3-macos.tar.gz","sha256":"%s"},"linux":{"name":"aster-cli-v0.1.3-linux.tar.gz","sha256":"%s"},"kylin":{"name":"aster-cli-v0.1.3-kylin.tar.gz","sha256":"%s"},"windows":{"name":"aster-cli-v0.1.3-windows.zip","sha256":"%s"}}}\n' \
            "$macos_sha" "$linux_sha" "$kylin_sha" "$windows_sha" > dist/latest.json
          if [[ -n "$ARTIFACT_RUN_ID" ]]; then
            built="$(gh api "repos/${GH_REPO}/actions/runs/${ARTIFACT_RUN_ID}" --jq .head_sha)"
          else
            built="$BUILD_SHA"
          fi
          cat > notes.md <<'EOF'
          aster-cli v0.1.3 — Core / ACP 9.1.5

          Long-running tasks now stop repeated refused calls and successful A/B workspace-state cycles without adding an implicit global tool-round ceiling. Original observation continuity recovers after an external edit; productive new states still continue.

          Host-issued invocation IDs fence late approvals across cancelled, answered, rejected, and later model calls. Goal deadlines cancel active model/tool/confirmation waits. Reopened host policies retain cumulative opportunities, absolute deadlines, original admissions, and recorded usage.

          The embeddable SDK remains Rust-only and local to this workspace. Optional workflow features remain disabled in the default CLI/ACP build.

          Qualification uses controlled-model actual ACP and compiler-VM workflows. It does not establish real-model Terminal Bench speed or token savings. Arbitrary persistence/export callbacks still require actual return before their original owner can retire; broader recovery-fault and changed-argument-loop boundaries remain under investigation.

          Each archive contains the locked release build of aster 0.1.3 and a3s-code-acp 9.1.5 from this repository, plus their shared BUILD_ID and SHA256SUMS. The binaries are unsigned.
          The linux archive targets current glibc; the kylin archive targets glibc 2.31.
          Update with `aster update`, or use `aster update --check` to inspect first. Installations predating the paired updater can use scripts/install.sh or scripts/install.ps1.
          EOF
          printf 'Built from %s.\n' "$built" >> notes.md
          # A rerun may extend this draft, never replace published assets.
          if gh release view aster-cli-v0.1.3 >/dev/null 2>&1; then
            test "$(gh release view aster-cli-v0.1.3 --json isDraft --jq .isDraft)" = true
            test "$(gh api "repos/${GH_REPO}/releases/tags/aster-cli-v0.1.3" --jq .target_commitish)" = "$built"
            gh release upload aster-cli-v0.1.3 "${files[@]}" dist/latest.json --clobber
          else
            gh release create aster-cli-v0.1.3 \
              --draft --target "$built" \
              --title "aster-cli v0.1.3" \
              --notes-file notes.md \
              "${files[@]}" dist/latest.json
          fi
          gh release view aster-cli-v0.1.3
