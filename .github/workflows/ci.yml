name: Rust

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install protobuf just lld
      - name: Install pinned toolchain
        run: rustup show active-toolchain
      # Stale contract steps were removed with the backend migration (e4914338e)
      # and ksandbox retirement (cd849b929): just_work.py, cli_sandbox*.py and
      # app_icon_assets.py no longer exist in this repository.
      - name: Restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: product-${{ runner.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format
        run: |
          cargo fmt --all -- --check
      - name: Install static guest targets
        run: rustup target add aarch64-unknown-linux-musl x86_64-unknown-linux-musl
      - name: Static guest linker hardening
        run: python3 tests/musl_linker_flags.py
      - name: Compile current static ACP binaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) zig_archive=x86_64-linux; zig_sha=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00 ;;
            aarch64) zig_archive=aarch64-linux; zig_sha=ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17 ;;
            *) echo "unsupported Zig host: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSL "https://ziglang.org/download/0.16.0/zig-${zig_archive}-0.16.0.tar.xz" -o "$RUNNER_TEMP/zig.tar.xz"
          echo "$zig_sha  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          zig_home="$RUNNER_TEMP/zig"
          mkdir -p "$zig_home"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_home" --strip-components=1
          # CI gate builds the x86_64 static ACP; the release matrix covers both arches.
          for guest_target in x86_64-unknown-linux-musl; do
            case "$guest_target" in
              x86_64-unknown-linux-musl) zig_target=x86_64-linux-musl; rust_env=x86_64_unknown_linux_musl; linker_var=CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER ;;
              aarch64-unknown-linux-musl) zig_target=aarch64-linux-musl; rust_env=aarch64_unknown_linux_musl; linker_var=CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER ;;
            esac
            cat > "$RUNNER_TEMP/zig-link" <<EOF
          #!/bin/sh
          exec "$zig_home/zig" cc -target "$zig_target" "\$@"
          EOF
            chmod +x "$RUNNER_TEMP/zig-link"
            env CRATE_CC_NO_DEFAULTS=1 \
              "CC_${rust_env}=$zig_home/zig cc -target $zig_target -Wno-nullability-completeness" \
              "CXX_${rust_env}=$zig_home/zig c++ -target $zig_target -Wno-nullability-completeness" \
              "${linker_var}=$RUNNER_TEMP/zig-link" \
              "${linker_var%LINKER}RUSTFLAGS=-C force-unwind-tables=yes -C relro-level=full -C link-self-contained=no" \
              cargo build --locked --release --target "$guest_target" -p aster-acp --bin aster-acp
          done
      - name: Internal dependency boundary
        run: python3 tests/workspace_dependencies.py
      - name: Pinned Studio checkout ownership
        run: python3 tests/studio_checkout.py
      - name: Studio land guards
        run: python3 tests/studio_land_guard.py
      - name: CLI pair delivery
        run: |
          python3 tests/cli_pair_delivery.py
          python3 tests/cli_pair_identity.py
      - name: Release tag and channel governance
        run: python3 tests/release_governance.py
      - name: Linux CLI glibc baseline, static musl pair, and installer
        run: |
          python3 tests/aster_cli_linux.py
          python3 tests/cli_musl.py
      - name: Kylin input method launcher
        run: |
          python3 tests/kylin_input_method.py
          python3 tests/progress_bench.py
          python3 apps/studio/scripts/kylin-flatpak/test_delivery.py
      - name: Desktop package generation contracts
        run: |
          python3 -m unittest apps/studio/scripts/tests/studio_delivery_test.py apps/studio/scripts/tests/studio_product_test.py apps/studio/scripts/tests/test_document_assets.py
          python3 tests/desktop_channel_manifest.py
      - name: Compile workspace and tests
        run: cargo check --locked --workspace --all-targets
      - name: Check optional harness contracts
        run: cargo check --locked -p aster-core --features ci-all,deep-live
      - name: Build product and companion
        run: |
          cargo build --locked -p aster -p aster-acp -p aster-office-cli
      - name: Build and test the desktop product identity
        run: |
          for tenant in aster; do
            export ASTER_TENANT_SLUG="$tenant"
            TAURI_CONFIG="$(python3 apps/studio/scripts/studio_product.py "$tenant" tauri-config)"
            export TAURI_CONFIG
            target_dir="$(cargo metadata --locked --offline --no-deps --format-version 1 | python3 -c 'import sys,json;print(json.load(sys.stdin)["target_directory"])')"
            TAURI_CONFIG="$(python3 apps/studio/scripts/studio_product.py "$tenant" tauri-config --target-dir "$target_dir")"
            export TAURI_CONFIG STUDIO_COMPANIONS_STAGED=1
            # The pinned tauri config maps studio-resources/document, but CI has
            # no node_modules font bundle for document_assets.py. tauri-build
            # only needs the mapped directory to exist; release packaging stages
            # the real assets.
            mkdir -p "$target_dir/debug/studio-resources/document"
            feature="$(python3 apps/studio/scripts/studio_product.py "$tenant" feature)"
            build_args=(build --locked -p aster-studio -p aster-acp -p aster-office-cli --no-default-features --features "aster-studio/$feature,aster-acp/default,aster-acp/headless-search,aster-office-cli/default")
            cargo "${build_args[@]}" --bin aster-acp --bin aster-office
            python3 apps/studio/scripts/studio_product.py "$tenant" stage-companions
            cargo "${build_args[@]}" --bin Studio
            cargo test --locked -p aster-studio --lib --no-default-features --features "$feature" tenant:: -- --test-threads=1
            cargo test --locked -p aster-studio --lib --no-default-features --features "$feature" providers:: -- --test-threads=1
            cargo test --locked -p aster-studio --lib --no-default-features --features "$feature" agent_plane::computer_use_tests:: -- --test-threads=1
            cargo test --locked -p aster-studio --lib --no-default-features --features "$feature" app_updater:: -- --test-threads=1
            cargo test --locked -p aster-studio --lib --no-default-features --features "$feature" bundled_skills:: -- --test-threads=1
          done
      - name: Product and runtime tests
        run: cargo test --locked -p aster -p aster-acl -p aster-effect
      - name: Shell bounded continuation contracts
        run: env -u GROK_LENGTH_SALVAGE cargo test --locked -p aster-shell --lib length_salvage -- --test-threads=1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.12.0"
      - name: Install Studio native contract dependencies
        working-directory: apps/studio
        run: |
          npm install --global pnpm@12.6.0 node-gyp
          pnpm install --frozen-lockfile
      - name: Studio native contracts
        run: cargo test --locked -p aster-studio-data-sqlite -p aster-studio-desktop-contract
      - name: ACP integration
        run: cargo test --locked -p aster-acp --test v912_seam
      - name: Local Git queries and Codex account discovery
        run: |
          cargo test --locked -p aster-core --test git_read_queries
          cargo test --locked -p aster-acp --test codex_account_stdio
      - name: Core long-task ownership and consent contracts
        run: |
          cargo test --locked -p aster-core --lib -- agent_api::goal_facade::tests fact_control:: goal_control:: hitl:: tool_confirmation:: --test-threads=4
      - name: ACP long-task foundation contracts
        run: |
          cargo test --locked -p aster-acp --test long_horizon_contracts --test long_horizon_preflight --test long_horizon_real_llm --test long_horizon_rust_stdio
          cargo test --locked -p aster-acp --features headless-search --test long_horizon_contracts --test long_horizon_preflight --test long_horizon_real_llm --test long_horizon_rust_stdio
      - name: macOS ACP wire conformance
        if: runner.os == 'macOS'
        run: cargo test --locked -p aster-acp --test acp_conformance_stdio
      - name: Search feature contracts
        run: |
          cargo test --locked -p aster-core --lib tools::builtin::web_search::tests
          cargo test --locked -p aster-core --features headless-search --lib tools::builtin::web_search::tests
      - name: Workspace retrieval contracts
        run: |
          cargo test --locked -p aster-core --lib -- tools::builtin::search workspace::retrieval::tests::hybrid_query agent_api::retrieval_tests permissions:: --test-threads=4
          cargo test --locked -p aster-acp --lib -- local_embedding retrieval_seam session_setup execution_capabilities host_context registration_cleanup --test-threads=4
          cargo test --locked -p aster-acp --test shipped_tui_e2e retrieval::shipped_retrieval_stdio -- --test-threads=1
      - name: Logo cache and rendering
        run: cargo test --locked -p aster-pager --lib views::welcome
      - name: TUI invariant A1 (CLI --model outranks ACL default)
        run: cargo test --locked -p aster-acp --test tui_913_hermetic cli_model_override_outranks_workspace_default_model -- --test-threads=1
      - name: Current memory-retention contracts
        # Each contract installs a thread-local tracing subscriber to capture
        # memory_retention events emitted by production tokio workers. When
        # these tests run concurrently, worker threads are shared and one
        # test's subscriber guard overrides another's, so the close-timeout
        # contract intermittently observes no event. Serial execution is the
        # standard fix for thread-local-subscriber tests. Reproduced locally:
        # 5/5 pass at --test-threads=1 vs 4/5 fail at --test-threads=4.
        run: cargo test --locked -p aster-core --lib memory_retention_tests -- --test-threads=1
      - name: macOS native execution boundary
        if: runner.os == 'macOS'
        run: cargo test --locked -p aster-core --lib sandbox::native::lifetime_tests

  acp-musl:
    name: Static ACP (x86_64 musl)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned workspace sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev curl xz-utils binutils bubblewrap
      - name: Install pinned toolchain
        run: |
          rustup show active-toolchain
          rustup target add x86_64-unknown-linux-musl
      - name: Cache musl dependencies
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          shared-key: code-acp-musl
          save-if: "true"
      - name: Install pinned Zig musl toolchain
        run: |
          set -euo pipefail
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o "$RUNNER_TEMP/zig.tar.xz"
          echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          zig_home="$RUNNER_TEMP/zig"
          mkdir -p "$zig_home"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$zig_home" --strip-components=1
          cat > "$RUNNER_TEMP/zig-link" <<EOF
          #!/bin/sh
          exec "$zig_home/zig" cc -target x86_64-linux-musl "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/zig-link"
          {
            echo "CRATE_CC_NO_DEFAULTS=1"
            echo "CC_x86_64_unknown_linux_musl=$zig_home/zig cc -target x86_64-linux-musl"
            echo "CXX_x86_64_unknown_linux_musl=$zig_home/zig c++ -target x86_64-linux-musl"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=$RUNNER_TEMP/zig-link"
            echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C force-unwind-tables=yes -C relro-level=full -C link-self-contained=no"
          } >> "$GITHUB_ENV"
      - name: Build and verify static ACP
        run: |
          set -euo pipefail
          cargo build --locked --release --target x86_64-unknown-linux-musl -p aster-acp --bin aster-acp
          python3 tests/acp_musl.py --machine x86_64 target/x86_64-unknown-linux-musl/release/aster-acp
      - name: Test musl ACP wire conformance
        run: cargo test --locked --release --target x86_64-unknown-linux-musl -p aster-acp --test acp_conformance_stdio -- --test-threads=1

  desktop-frontend:
    strategy:
      fail-fast: false
      matrix:
        tenant: [aster]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned desktop sources
        uses: ./.github/actions/checkout-studio
        with:
          token: ${{ secrets.STUDIO_READ_TOKEN }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.12.0"
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: ASTER_TENANT_SLUG=${{ matrix.tenant }} STUDIO_RENDERER_DIST=.studio-package pnpm exec rsbuild build
      - name: Studio launcher contracts
        run: pnpm exec vitest run --project scripts scripts/__tests__/studioDev.test.ts scripts/__tests__/check-dependency-lockstep.test.ts
      - name: Studio perf/layout contracts
        run: node scripts/run-perf-layout-contracts.mjs
      - name: Motion contract
        run: node scripts/check-motion-contract.mjs
